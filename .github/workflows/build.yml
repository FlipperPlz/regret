name: build

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-gnu,   os: linux,   variant: stripped,   strip: true }
          - { target: x86_64-linux-gnu,   os: linux,   variant: unstripped, strip: false }
          - { target: x86_64-windows-gnu, os: windows, variant: pdb,        strip: false }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - id: ver
        run: echo "version=$(tr -d ' \r\n' < .version)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: >
          zig build
          -Dtarget=${{ matrix.target }}
          -Doptimize=ReleaseSafe
          -Dstrip=${{ matrix.strip }}

      - name: Package
        env:
          BASE: regret-v${{ steps.ver.outputs.version }}
          OS: ${{ matrix.os }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p dist

          if [ "$OS" = "windows" ]; then
            exe_path=$(find zig-out -type f -name 'regret*.exe' | head -n 1)
            pdb_path=$(find zig-out -type f -name 'regret*.pdb' | head -n 1)

            if [ -z "$exe_path" ] || [ -z "$pdb_path" ]; then
              echo "Error: Could not find .exe and/or .pdb in zig-out/"
              find zig-out
              exit 1
            fi

            cp "$exe_path" "dist/${BASE}.exe"
            cp "$pdb_path" "dist/${BASE}.pdb"
          else
            bin_path=$(find zig-out -type f -name 'regret' | head -n 1)

            if [ -z "$bin_path" ]; then
              echo "Error: Could not find compiled binary in zig-out/"
              find zig-out
              exit 1
            fi

            cp "$bin_path" "dist/${BASE}-${OS}-${VARIANT}"
          fi

          ls -l dist

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'linux'
        with:
          path: dist/regret-v${{ steps.ver.outputs.version }}-linux-${{ matrix.variant }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows'
        with:
          path: dist/regret-v${{ steps.ver.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows'
        with:
          path: dist/regret-v${{ steps.ver.outputs.version }}.pdb
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
